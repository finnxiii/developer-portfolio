<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- Anti-flash: apply saved theme before first paint -->
		<script>
			(function(){var s=localStorage.getItem('theme');var t=s||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();
		</script>

		<!-- Favicons -->
		<link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
		<link rel="manifest" href="/favicon/site.webmanifest" />
		<meta name="theme-color" content="#FAFAF8" />

		<!-- Default title / SEO — overridden per-route via SEOHead component -->
		<title>Naing Htoo Lwin | Software Engineer</title>
		<meta name="description" content="Personal engineering portfolio of Naing Htoo Lwin — selected builds, case studies, engineering philosophy, and field notes." />
		<meta name="author" content="Naing Htoo Lwin" />

		<!-- Open Graph -->
		<meta property="og:site_name" content="FINNXIII.DEV" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Naing Htoo Lwin | Software Engineer" />
		<meta property="og:description" content="Personal engineering portfolio of Naing Htoo Lwin — selected builds, case studies, engineering philosophy, and field notes." />
		<meta property="og:image" content="/images/og/default.png" />

		<!-- Twitter / X -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Naing Htoo Lwin | Software Engineer" />
		<meta name="twitter:description" content="Personal engineering portfolio of Naing Htoo Lwin." />
		<meta name="twitter:image" content="/images/og/default.png" />

		<!-- Fonts — preconnect then load -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@400;500&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
